[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "air-route"
version = "0.1.0"
description = "Airline Route Explorer and Travel Planner"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Flask>=3.0,<4",
  "Flask-JWT-Extended>=4.6,<5",
  "Flask-RESTX>=1.3,<2",
  "Flask-SQLAlchemy>=3.1,<4",
  "matplotlib>=3.9,<4",
  "passlib>=1.7,<2",
  "PyJWT>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "requests>=2.32,<3",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["airroute*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py313"
exclude = [
  ".git",
  ".venv",
  "build",
  "dist",
  "venv",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
